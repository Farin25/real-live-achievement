<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AchieveIRL Notification</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: #111118;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .notif {
      background: rgba(30, 30, 40, 0.92);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 380px;
      border: 0.5px solid rgba(255, 255, 255, 0.12);
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .notif-content {
      flex: 1;
      min-width: 0;
    }

    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .app-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .notif-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
    }

    .notif-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 1px;
    }

    .notif-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.3;
    }

    .controls {
      width: 100%;
      max-width: 380px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    input[type=text] {
      width: 100%;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      outline: none;
      -webkit-appearance: none;
    }

    input[type=text]::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    input[type=text]:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.15);
    }

    .search-input {
      width: 100%;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      outline: none;
      -webkit-appearance: none;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.15);
    }

    .category-section {
      margin-top: 10px;
    }

    .category-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    .achievements-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ach-pill {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: background 0.15s;
    }

    .ach-pill:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .ach-pill.hidden {
      display: none;
    }

    .dl-btn {
      margin-top: 4px;
      width: 100%;
      padding: 10px 28px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.15s;
    }

    .dl-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="notif" id="notif-card">
    <div class="icon">
      <img src="favicon.png" alt="AchieveIRL" id="app-icon">
    </div>
    <div class="notif-content">
      <div class="notif-header">
        <span class="app-name">AchieveIRL</span>
        <span class="notif-time">jetzt</span>
      </div>
      <div class="notif-title" id="notif-title">Mountain Goat unlocked!</div>
      <div class="notif-text" id="notif-text">Du hast einen Berg über 2000m bestiegen</div>
    </div>
  </div>

  <div class="controls">
    <div>
      <div class="field-label">Titel</div>
      <input type="text" id="input-title" value="Mountain Goat unlocked!" oninput="update()">
    </div>
    <div>
      <div class="field-label">Text</div>
      <input type="text" id="input-text" value="Du hast einen Berg über 2000m bestiegen" oninput="update()">
    </div>
    <button class="dl-btn" onclick="download()">PNG herunterladen (ohne Hintergrund)</button>
    <div>
      <div class="field-label">Schnellauswahl</div>
      <input class="search-input" type="text" id="search-achievements" placeholder="Achievement suchen…" oninput="filterAchievements(this.value)">
      <div id="achievements-container"></div>
    </div>
  </div>

  <p class="hint">Alle Rechte Vorbehlaten © Farin Langner</p>

    function buildAchievements() {
      const container = document.getElementById('achievements-container');
      container.innerHTML = '';
      for (const [category, items] of Object.entries(ACHIEVEMENTS)) {
        const section = document.createElement('div');
        section.className = 'category-section';

        const label = document.createElement('div');
        label.className = 'category-label';
        label.textContent = category;
        section.appendChild(label);

        const grid = document.createElement('div');
        grid.className = 'achievements-grid';
        grid.dataset.category = category;

        for (const [name, desc] of items) {
          const pill = document.createElement('span');
          pill.className = 'ach-pill';
          pill.textContent = name;
          pill.dataset.name = name.toLowerCase();
          pill.dataset.desc = desc.toLowerCase();
          pill.onclick = () => set(name + ' unlocked!', desc);
          grid.appendChild(pill);
        }

        section.appendChild(grid);
        container.appendChild(section);
      }
    }

    function filterAchievements(query) {
      const q = query.toLowerCase().trim();
      const container = document.getElementById('achievements-container');
      const sections = container.querySelectorAll('.category-section');

      sections.forEach(section => {
        const pills = section.querySelectorAll('.ach-pill');
        let anyVisible = false;
        pills.forEach(pill => {
          const matches = !q || pill.dataset.name.includes(q) || pill.dataset.desc.includes(q);
          pill.classList.toggle('hidden', !matches);
          if (matches) anyVisible = true;
        });
        section.style.display = anyVisible ? '' : 'none';
      });
    }

    function update() {
      document.getElementById('notif-title').textContent = document.getElementById('input-title').value;
      document.getElementById('notif-text').textContent = document.getElementById('input-text').value;
    }

    function set(title, text) {
      document.getElementById('input-title').value = title;
      document.getElementById('input-text').value = text;
      update();
    }

    async function download() {
      const el = document.getElementById('notif-card');
      const canvas = await html2canvas(el, {
        backgroundColor: null,
        scale: 3,
        useCORS: true,
        allowTaint: true,
        logging: false
      });
      const link = document.createElement('a');
      link.download = 'achieveirl-notification.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    buildAchievements();
  </script>

</body>

</html>
